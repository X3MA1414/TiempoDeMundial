name: Generar Release Android

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Compilar y publicar APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Dar permisos a Gradle
        run: chmod +x gradlew

      - name: Compilar APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Renombrar APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk \
             "release/LaHoraDelPartido-${GITHUB_REF_NAME}.apk"

      # Si la release ya existe (por ejemplo creada a mano desde la web antes de
      # que terminara la compilación), "gh release create" falla. En ese caso
      # basta con adjuntarle el APK.
      - name: Publicar GitHub Release
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "La release $GITHUB_REF_NAME ya existe: se adjunta el APK."
            gh release upload "$GITHUB_REF_NAME" release/*.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              release/*.apk \
              --verify-tag \
              --title "La Hora del Partido $GITHUB_REF_NAME" \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
